<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Productivity Playbook — master psychology, level up your life.">

  <title>Productivity Playbook</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">

  <!-- Marked.js + DOMPurify for safe markdown rendering in reader mode -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>

  <!-- ======== Login Screen ======== -->
  <section id="login-screen" class="login-screen" aria-label="Sign in">
    <div class="login-content">
      <svg class="login-logo" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#E5A764"/>
        <path d="M15 33V21l9-6 9 6v12" stroke="#0F0F0F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 33v-6h6v6" stroke="#0F0F0F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="login-title">Productivity Playbook</h1>
      <p class="login-subtitle">Master psychology. Level up your life.</p>

      <button id="login-btn" class="login-btn" type="button" aria-label="Get started">
        <span>Get Started</span>
      </button>
    </div>
  </section>

  <!-- ======== Main App ======== -->
  <main id="app" class="app" hidden>

    <!-- Tab Panels (4 tabs) -->
    <section id="tab-today" class="tab-panel active" role="tabpanel" aria-label="Today">
      <!-- Rendered by js/tabs/today.js -->
    </section>

    <section id="tab-track" class="tab-panel" role="tabpanel" aria-label="Track">
      <!-- Rendered by js/tabs/track.js — contains sub-tabs -->
    </section>

    <section id="tab-learn" class="tab-panel" role="tabpanel" aria-label="Learn">
      <!-- Rendered by js/tabs/learn.js — skill tree -->
    </section>

    <section id="tab-profile" class="tab-panel" role="tabpanel" aria-label="Profile">
      <!-- Rendered by js/tabs/profile.js -->
    </section>

    <!-- Fixed Bottom Navigation (4 tabs) -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">

      <button class="nav-btn active" data-tab="tab-today" type="button" aria-label="Today" aria-current="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Today</span>
      </button>

      <button class="nav-btn" data-tab="tab-track" type="button" aria-label="Track">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Track</span>
      </button>

      <button class="nav-btn" data-tab="tab-learn" type="button" aria-label="Learn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span>Learn</span>
      </button>

      <button class="nav-btn" data-tab="tab-profile" type="button" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </button>

    </nav>
  </main>

  <!-- ======== Loading ======== -->
  <div id="loading" class="loading-screen" hidden aria-label="Loading" role="status">
    <div class="spinner"></div>
  </div>

  <!-- ======== Toast Container ======== -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
